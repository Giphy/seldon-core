{% set data = load_setup_py_data() %}

package:
  name: python-seldon-core
  version: {{ data.version }}

source:
  path: ../

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install --no-deps . -vv"
  entry_points:
   - seldon-core-microservice = seldon_core.microservice:main
   - seldon-core-tester = seldon_core.tester:main
   - seldon-core-api-tester = seldon_core.api_tester:main

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=84.0.0,<85.0.0
  run:
    - python >=3.12
    - flask >=3.1.3,<4.0.0
    - jsonschema >=4.26.0,<5.0.0
    - flask-cors >=6.0.5,<7.0.0
    - requests >=2.34.2,<3.0.0
    - numpy >=2.5.2,<3.0.0
    - protobuf >=7.36.0,<8.0.0
    - grpcio >=1.83.0,<2.0.0
    - grpcio-reflection >=1.83.0,<2.0.0
    - gunicorn >=26.2.0,<27.0.0
    - prometheus_client >=0.26.0,<1.0.0
    - werkzeug >=3.1.8,<4.0.0
    - cryptography >=50.0.1,<51.0.0
    - pyyaml >=6.0.3,<7.0.0
    - click >=8.5.0,<9.0.0
    - urllib3 >=2.7.0,<3.0.0
    - opentelemetry-api >=1.44.0,<2.0.0
    - opentelemetry-sdk >=1.44.0,<2.0.0
    - opentelemetry-exporter-otlp-proto-grpc >=1.44.0,<2.0.0
    - opentelemetry-instrumentation-flask >=0.65b0,<1.0.0
    - opentelemetry-instrumentation-grpc >=0.65b0,<1.0.0
    - ddtrace >=4.14.0,<5.0.0
    - tornado
    - python-flatbuffers
    - tensorflow >=2.21.0,<3.0.0

test:
  imports:
    - seldon_core
  requires:
    - pytest >=9.1.1,<10.0.0
  source_files:
    - tests/*
  commands:
    - seldon-core-microservice --help
    - seldon-core-tester --help
    - seldon-core-api-tester --help
    - python -m pytest tests

about:
  home: https://github.com/SeldonIO/seldon-core
  dev_url: https://github.com/SeldonIO/seldon-core
  license: Apache 2.0
  license_family: Apache
  license_file: LICENSE
  summary: Seldon Core client and microservice wrapper
